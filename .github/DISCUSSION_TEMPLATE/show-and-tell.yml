title: "[Show & Tell] "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        Share something you have built, integrated, or learned with Open Banking Labs or DCC.

  - type: textarea
    id: project
    attributes:
      label: What did you build or explore?
      description: Briefly describe your project, integration, experiment, or practice.
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link (optional)
      description: Repository, demo, article, or other relevant URL.
      placeholder: "https://..."
    validations:
      required: false

  - type: textarea
    id: dcc-usage
    attributes:
      label: How does it relate to DCC?
      description: Which DCC capabilities, APIs, or patterns did you use?
    validations:
      required: false

  - type: textarea
    id: lessons
    attributes:
      label: Lessons learned (optional)
      description: Anything surprising, useful, or worth sharing with others?
    validations:
      required: false
