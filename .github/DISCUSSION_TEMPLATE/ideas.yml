title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Share a feature idea or improvement suggestion for Open Banking Labs or DCC.

        Please describe the **problem or gap** first, then your proposed idea. This helps evaluate whether the idea fits the project direction.

  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What is missing, frustrating, or not working well in the current DCC or Open Banking Labs experience?
      placeholder: "Example: When integrating DCC, I cannot easily find..."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: What would you like to see? How do you imagine it working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Have you worked around this in another way?
    validations:
      required: false
